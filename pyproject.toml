[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-sz-model"
version = "0.1.0"
description = "Core Sz model training and Shilou/Jiaxian CO2 prediction."
requires-python = ">=3.10"
dependencies = [
    "joblib",
    "numpy",
    "pandas",
    "scikit-learn",
]

[project.optional-dependencies]
fast = ["numba"]

[project.scripts]
sz-train = "py_sz_model.training:main"
sz-predict = "py_sz_model.prediction:main"
sz-calc-r = "py_sz_model.r_calculation:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["py_sz_model*"]
