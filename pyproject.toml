[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-sz-model"
version = "0.2.0"
description = "Manuscript release of the 99-sample Sz calibration and 92-sample CO2 reconstruction."
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.5,<2",
    "numpy>=2.2,<3",
    "pandas>=2.3,<3",
    "scipy>=1.10,<2",
    "scikit-learn==1.7.2",
]

[project.optional-dependencies]
fast = ["numba"]

[project.scripts]
sz-train = "py_sz_model.training:main"
sz-predict = "py_sz_model.prediction:main"
sz-calc-r = "py_sz_model.r_calculation:main"
sz-ratios = "py_sz_model.ratios:main"
sz-manuscript = "py_sz_model.manuscript:main"
sz-proxy-checks = "py_sz_model.proxy_checks:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["py_sz_model*"]
